<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聽團仔之夜｜投影牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B0E1A; --paper:#F4EDE0; }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:var(--ink); color:var(--paper);
    font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  .stage{ position:relative; height:100vh; display:flex; align-items:center; justify-content:center; }

  .ticket{
    width:100vw; height:100vh;
    background:var(--tpl-bg, #123E8C);
    color:var(--tpl-fg, #E8323A);
    border-radius:0;
    padding:8vh 8vw;
    position:relative; overflow:hidden; opacity:0;
    font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
    font-weight:500;
    transition:background-color 0.6s ease, color 0.6s ease;
  }
  .ticket.show{ opacity:1; }
  .poster-inner{
    height:100%;
    display:flex; flex-direction:column; justify-content:space-between;
    transition:opacity 0.5s ease;
  }

  .rows{ display:flex; flex-direction:column; gap:5vh; }
  .row{ display:flex; flex-wrap:wrap; align-items:baseline; column-gap:0.5em; row-gap:0.15em; }
  .row .label{
    font-size:6vw; font-weight:500; white-space:nowrap;
    display:inline-block; overflow:hidden; vertical-align:baseline;
  }
  .row .label .sq-inner{
    display:inline-block; white-space:nowrap; transform-origin:left;
  }
  .row .value{
    font-size:4vw; font-weight:500;
    text-decoration:underline; text-underline-offset:0.14em; text-decoration-thickness:2px;
    word-break:break-word;
  }

  .wish-row{ display:flex; flex-wrap:wrap; align-items:baseline; column-gap:0.5em; row-gap:0.15em; }
  .wish-row .label{ font-size:2.6vw; font-weight:500; opacity:0.85; white-space:nowrap; }
  .wish-row .value{
    font-size:4vw; font-weight:500;
    text-decoration:underline; text-underline-offset:0.14em; text-decoration-thickness:2px;
    word-break:break-word;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="ticket" id="ticket">
      <div class="poster-inner" id="posterInner"></div>
    </div>
  </div>

<script>
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyI8-QgBqnkcjhJrK7ZcJkKob-_Y0I0IsaZUjpGdO-7GPedKu7SDb6UUveD-Aiv4Pwo/exec";
  var POLL_MS = 4000;
  var MIN_DISPLAY_MS = 15000;
  var FADE_MS = 500;

  var seenIds = new Set();
  var queue = [];
  var allItems = [];
  var randomBag = [];
  var lastShownId = null;
  var showing = false;
  var ticketEl = document.getElementById('ticket');
  var posterInnerEl = document.getElementById('posterInner');

  var COLOR_PALETTE = [
    { bg:'#123E8C', fg:'#E8323A' },
    { bg:'#7A1010', fg:'#E8323A' },
    { bg:'#0A0A0A', fg:'#C13FD6' }
  ];
  var COLOR_STREAK = 10;
  var colorIndex = 0, colorUseCount = 0;

  function nextColor_(){
    if (colorUseCount >= COLOR_STREAK) {
      colorIndex = (colorIndex + 1) % COLOR_PALETTE.length;
      colorUseCount = 0;
    }
    colorUseCount++;
    return COLOR_PALETTE[colorIndex];
  }

  function escapeHtml_(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // 如果內容太多、三行加起來超出可用高度，整體字級等比縮小到塞得下為止
  function fitRowsToHeight_(rowsEl, availableHeight){
    if (!rowsEl || availableHeight <= 0) return;
    var actual = rowsEl.scrollHeight;
    if (actual <= availableHeight) return;
    var ratio = availableHeight / actual * 0.94;
    rowsEl.querySelectorAll('.label, .value').forEach(function(el){
      var cur = parseFloat(getComputedStyle(el).fontSize);
      el.style.fontSize = Math.max(14, cur * ratio) + 'px';
    });
  }

  // 把大標籤（我是／我喜歡／因為）文字拉長變窄，但不佔用多餘寬度，
  // 讓後面的內容一樣緊接在旁邊，不會多出一段空白
  var LABEL_SCALE_X = 0.6;
  function squeezeLabel_(el){
    var text = el.textContent;
    el.innerHTML = '<span class="sq-inner">' + escapeHtml_(text) + '</span>';
    var inner = el.firstChild;
    inner.style.transform = 'none';
    var naturalWidth = inner.offsetWidth;
    el.style.width = (naturalWidth * LABEL_SCALE_X) + 'px';
    inner.style.transform = 'scaleX(' + LABEL_SCALE_X + ')';
  }

  function renderPoster(item){
    var color = nextColor_();
    ticketEl.style.setProperty('--tpl-bg', color.bg);
    ticketEl.style.setProperty('--tpl-fg', color.fg);

    var wishHtml = item.wish
      ? '<div class="wish-row"><span class="label">許願下次聽團仔之夜…</span><span class="value">' + escapeHtml_(item.wish) + '</span></div>'
      : '<div class="wish-row"></div>';

    posterInnerEl.innerHTML =
      '<div class="rows">' +
        '<div class="row"><span class="label">我是</span><span class="value">' + escapeHtml_(item.nick || '不具名') + '</span></div>' +
        '<div class="row"><span class="label">我喜歡</span><span class="value">' + escapeHtml_(item.artist) + '《' + escapeHtml_(item.song) + '》</span></div>' +
        '<div class="row"><span class="label">因為</span><span class="value">' + escapeHtml_(item.why) + '</span></div>' +
      '</div>' +
      wishHtml;

    var rowsEl = posterInnerEl.querySelector('.rows');
    var availableHeight = posterInnerEl.clientHeight * 0.68; // 留給下面許願列的空間
    fitRowsToHeight_(rowsEl, availableHeight);

    // 高度縮放算完之後才做標籤拉長變窄，不然量測到的寬度會不準
    rowsEl.querySelectorAll('.label').forEach(squeezeLabel_);
  }

  function shuffle_(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function pickRandom_(){
    if (allItems.length === 0) return null;
    if (allItems.length === 1) return allItems[0];
    if (randomBag.length === 0) {
      randomBag = shuffle_(allItems);
      if (randomBag[0].id === lastShownId) {
        var tmp = randomBag[0]; randomBag[0] = randomBag[1]; randomBag[1] = tmp;
      }
    }
    return randomBag.shift();
  }

  function showNext(){
    if (showing) return;
    var item = queue.length > 0 ? queue.shift() : pickRandom_();
    if (!item) return;

    showing = true;
    lastShownId = item.id;

    if (!ticketEl.classList.contains('show')) {
      renderPoster(item);
      ticketEl.classList.add('show');
      holdThenNext_();
    } else {
      posterInnerEl.style.opacity = '0';
      setTimeout(function(){
        renderPoster(item);
        posterInnerEl.style.opacity = '1';
        holdThenNext_();
      }, FADE_MS);
    }
  }

  function holdThenNext_(){
    setTimeout(function(){ showing = false; showNext(); }, MIN_DISPLAY_MS);
  }

  function poll(){
    fetch(APPS_SCRIPT_URL + '?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(list){
        list.sort(function(a,b){ return a.time - b.time; });
        var visibleIds = {};
        list.forEach(function(item){
          visibleIds[item.id] = true;
          var known = allItems.some(function(p){ return p.id === item.id; });
          if (!known) {
            if (!seenIds.has(item.id)) queue.push(item);
            allItems.push(item);
            seenIds.add(item.id);
          }
        });
        allItems = allItems.filter(function(p){ return visibleIds[p.id]; });
        queue = queue.filter(function(p){ return visibleIds[p.id]; });
        randomBag = randomBag.filter(function(p){ return visibleIds[p.id]; });
        showNext();
      })
      .catch(function(err){ console.error('poll error', err); });
  }

  function start_(){ poll(); setInterval(poll, POLL_MS); }
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(start_); } else { start_(); }
</script>
</body>
</html>
